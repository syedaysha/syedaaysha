.book.open.ready .page.l{opacity:1;visibility:visible;transform:none}

.book.open.ready .leaf{visibility:hidden}
.page.r{left:var(--pw);transform:translateZ(-2px);box-shadow:0 10px 30px rgba(40,20,5,.35),inset 8px 0 14px -8px rgba(60,30,10,.35)}

.book.open .leaf{transform:rotateY(-180deg);cursor:default;pointer-events:none}

.fl{position:absolute;transform-origin:50% 92%;transition:opacity .35s,transform .25s;will-change:transform;filter:drop-shadow(0 0 5px rgba(255,190,40,.9)) drop-shadow(0 0 10px rgba(255,170,30,.5));pointer-events:none;animation:flick 1.4s ease-in-out infinite alternate;animation-delay:var(--d)}
.fl img{display:block;width:100%;height:100%}
@keyframes flick{from{transform:rotate(-2deg) scaleY(1)}to{transform:rotate(2.5deg) scaleY(1.06)}}
.blown .fl,.fl.out{opacity:0;animation:none}
.bending .fl{animation:none}
.msg{position:absolute;left:6%;right:6%;top:20.5%;text-align:center;font-size:calc(var(--pw)*.062);color:var(--red);font-weight:700;opacity:0;transform:translateY(6px);transition:.5s;z-index:3;line-height:1.25}
.blown .msg{opacity:1;transform:none}
.ui{position:absolute;left:8%;right:8%;bottom:4.5%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--pw)*.02);z-index:3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.meter{width:100%;display:flex;align-items:center;gap:6px;font-size:calc(var(--pw)*.045);color:#6a5540}
.bar{flex:1;height:calc(var(--pw)*.04);min-height:5px;background:rgba(74,46,34,.15);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0b23a,#b93a3a);border-radius:9px}
.st{font-size:calc(var(--pw)*.043);color:#6a5540;text-align:center;line-height:1.3;min-height:2.4em}
.btn{font:inherit;font-weight:700;font-size:calc(var(--pw)*.056);color:#fff;background:var(--red);border:0;border-radius:99px;padding:.55em 1.1em;box-shadow:0 3px 0 rgba(90,30,20,.35);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.alt{background:var(--blue);touch-action:manipulation}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,.letter:focus-visible,.leaf:focus-visible,.back:focus-visible{outline:3px solid #2d5b86;outline-offset:2px}
.back{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);font:600 15px system-ui,sans-serif;color:var(--ink);background:#f6dfa0;border:0;border-radius:99px;padding:9px 18px;box-shadow:0 3px 0 rgba(60,30,10,.3);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.book.open.ready~.back{opacity:1;pointer-events:auto}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.book,.leaf,.letter{transition-duration:.01s}.fl{animation:none}}
</style></head><body>
<div class="stage"><div class="book" id="book">
 <section class="page l" aria-label="Letter">
  <i class="tape" style="left:-6%;top:3%;transform:rotate(-8deg)"></i><i class="tape" style="right:-8%;top:6%;transform:rotate(40deg);width:26%"></i>
  <button class="letter" id="letter" aria-label="Read the letter" aria-expanded="false"></button>
  <div class="env"></div>
  <div class="cap" id="cap">tap the letter to read it</div>
 </section>
 <section class="page r" aria-label="Make a wish">
  <i class="tape" style="left:-8%;top:4%;transform:rotate(-12deg);width:40%"></i>
  <div class="wish">MAKE A WISH</div>
  <div class="msg" id="msg">yayyyy Happyyy Birthday Arfaath</div>
  <div class="cakebox" id="cakebox"><div class="cake"></div></div>
  <div class="ui">
   <div class="meter"><span>mic</span><div class="bar"><i id="lvl"></i></div></div>
   <div class="st" id="st">Blow into your mic to blow out the candles.</div>
   <button class="btn" id="hold" aria-label="Hold to blow">Hold to blow</button>
   <button class="btn alt" id="relight" hidden>Relight</button>
  </div>
 </section>
 <div class="leaf" id="leaf" role="button" tabindex="0" aria-label="Open the card"><div class="face front"></div><div class="face back"></div></div>
</div>
<div class="hint" id="hint">tap the card to open</div>
<button class="back" id="back">Back to cover</button></div>

const $=id=>document.getElementById(id),book=$('book'),root=document.documentElement;
const AR=.5689655,PAGE_PAD=12;
function layout(){const vw=innerWidth,vh=innerHeight;
 let pw=Math.min((vw-PAGE_PAD*2)/2,(vh-150)*AR);pw=Math.max(pw,90);const ph=pw/AR;
 const s=Math.max(1,Math.min((vw-40)/pw,(vh-110)/ph));
 root.style.setProperty('--pw',pw+'px');root.style.setProperty('--ph',ph+'px');root.style.setProperty('--s',s);}
layout();addEventListener('resize',layout);
/* flames */
const box=$('cakebox'),fls=FLAMES.map((f,i)=>{const d=document.createElement('div');d.className='fl';
 Object.assign(d.style,{left:(f.x-f.w/2)*100+'%',top:(f.y-f.h)*100+'%',width:f.w*100+'%',height:f.h*100+'%'});
 d.style.setProperty('--d',(-(i*.37)%1.4)+'s');d.innerHTML='<img alt="" src="'+f.src+'">';box.appendChild(d);return d;});
/* open / close */
let stream=null,ctx=null,an=null,raf=0,micOK=false;
function openCard(){book.classList.add('open');$('leaf').setAttribute('aria-label','Card is open');setTimeout(()=>book.classList.add('ready'),820);startMic();}
function closeCard(){setLetter(false);book.classList.remove('ready');setTimeout(()=>book.classList.remove('open'),300);stopMic();}
$('leaf').addEventListener('click',()=>{if(!book.classList.contains('open'))openCard()});
$('leaf').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!book.classList.contains('open')){e.preventDefault();openCard()}});
$('back').onclick=closeCard;
/* letter */
const letter=$('letter');
function setLetter(up){letter.classList.toggle('up',up);letter.setAttribute('aria-expanded',up);$('cap').textContent=up?'tap the letter to tuck it back':'tap the letter to read it';}
letter.onclick=()=>setLetter(!letter.classList.contains('up'));
/* blowing */
const st=$('st'),lvl=$('lvl');let blowT=0,intensity=0,holding=false,out=false,last=performance.now(),level=0,floor=.01;
function setStatus(t){st.textContent=t}
async function startMic(){
 if(micOK||!book.classList.contains('open'))return;
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Mic needs https. Hold the button or space bar to blow.');return;}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  if(!book.classList.contains('open')){stopMic();return;}
  ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();
  an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.2;ctx.createMediaStreamSource(stream).connect(an);micOK=true;setStatus('Listening. Blow into your mic.');}
 catch(e){setStatus('Mic blocked. Hold the button or space bar to blow.');}}
function stopMic(){micOK=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)ctx.close();ctx=null;an=null;lvl.style.width='0';}
function micLevel(){if(!an)return{lv:0,blow:false};
 const buf=new Float32Array(an.fftSize);an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
 const f=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(f);
 const n=f.length>>2;let lo=0,tot=1;for(let i=1;i<n*2;i++){tot+=f[i];if(i<n/2)lo+=f[i];}
 const lowShare=lo/tot; // wind/breath is bass heavy and noisy
 floor=Math.min(floor*1.002+1e-5,Math.max(rms,.004)*1.0+ (rms<floor?0:0));if(rms<floor)floor=rms*.9+floor*.1;
 const thr=Math.max(.05,floor*4);
 return{lv:rms,blow:rms>thr&&lowShare>.32};}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 let target=0,blowing=false;
 if(book.classList.contains('open')&&book.classList.contains('ready')){
  const m=micLevel();level=level*.6+m.lv*.4;lvl.style.width=Math.min(100,level*380)+'%';
  if(m.blow){blowing=true;target=Math.min(1,.5+m.lv*4);}
  if(holding){blowing=true;target=.9;}}
 intensity+=(target-intensity)*Math.min(1,dt*10);
 if(!out){
  blowT=blowing?blowT+dt:Math.max(0,blowT-dt*1.5);
  book.classList.toggle('bending',intensity>.05);
  fls.forEach((f,i)=>{const k=intensity*(.85+.3*Math.sin(i*1.7+now/90));
   if(intensity>.05)f.style.transform=`rotate(${k*42}deg) skewX(${-k*18}deg) scaleY(${1-k*.22})`;else f.style.transform='';});
  if(blowT>=.5)blowOut();}
 raf=requestAnimationFrame(tick);}
function blowOut(){out=true;blowT=0;
 fls.forEach((f,i)=>{f.style.transition='opacity .35s '+(i%7)*35+'ms,transform .3s';f.classList.add('out');});
 $('cakebox').parentElement.classList.add('blown');$('relight').hidden=false;$('hold').hidden=true;setStatus('Make it a good one.');confetti();}
function relight(){out=false;blowT=0;intensity=0;
 fls.forEach(f=>{f.style.transition='';f.style.transform='';f.classList.remove('out');});
 $('cakebox').parentElement.classList.remove('blown');$('relight').hidden=true;$('hold').hidden=false;
 setStatus(micOK?'Listening. Blow into your mic.':st.dataset.m||'Hold the button or space bar to blow.');}
$('relight').onclick=relight;
const hold=$('hold');
const hs=e=>{e.preventDefault();holding=true;hold.classList.add('on');};const he=()=>{holding=false;hold.classList.remove('on');};
hold.addEventListener('pointerdown',hs);['pointerup','pointercancel','pointerleave'].forEach(t=>hold.addEventListener(t,he));
addEventListener('keydown',e=>{if(e.code==='Space'&&book.classList.contains('ready')){e.preventDefault();if(!out){holding=true;hold.classList.add('on');}}});
addEventListener('keyup',e=>{if(e.code==='Space'&&book.classList.contains('ready')){e.preventDefault();he();}});
requestAnimationFrame(tick);
/* confetti */
const cv=$('cf'),cx=cv.getContext('2d');let parts=[],run=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}size();addEventListener('resize',size);
function confetti(){const r=box.getBoundingClientRect(),cols=['#b93a3a','#e0b23a','#557a95','#6fa05a','#f2d9a0','#d9776a'],dp=devicePixelRatio;
 const N=matchMedia('(prefers-reduced-motion:reduce)').matches?40:170;
 for(let i=0;i<N;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=(6+Math.random()*10)*dp;
  parts.push({x:(r.left+r.width*(.15+Math.random()*.7))*dp,y:(r.top+r.height*.15)*dp,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:(5+Math.random()*6)*dp,h:(3+Math.random()*5)*dp,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],life:0});}
 if(!run){run=true;requestAnimationFrame(cfTick);}}
function cfTick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life<220&&p.y<cv.height+40);
 parts.forEach(p=>{p.life++;p.vy+=.28*devicePixelRatio;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,(220-p.life)/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
 if(parts.length)requestAnimationFrame(cfTick);else run=false;}
window.__test={get out(){return out},blowOut,openCard,closeCard,relight};
